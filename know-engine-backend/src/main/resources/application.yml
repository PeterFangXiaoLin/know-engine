server:
  port: 9090
  servlet:
    context-path: /api

spring:
  profiles:
    default: local
  application:
    name: know-engine-backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/know_engine?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

mineru:
  base-url: ${MINERU_BASE_URL:https://mineru.net}
  token: ${MINERU_TOKEN:}
  model-version: vlm
  language: ch
  http-timeout: 2m
  poll-interval: 3s
  poll-timeout: 10m

# XXL-Job 配置
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8080/ # xxl-job-admin 地址，记得改成你自己的
    executor:
      enabled: true
      appname: know-engine-executor # 执行器名称
      accessToken: default_token